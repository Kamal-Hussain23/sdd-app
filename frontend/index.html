<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Ordering System</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 30rem;
      margin: 3rem auto;
      padding: 0 1rem;
      text-align: center;
    }
    button {
      font-size: 1.1rem;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Cafe Ordering System</h1>
  <p>Walking skeleton — check that the server is reachable.</p>

  <button id="check">Check server</button>
  <p id="result"></p>

  <script>
    const button = document.getElementById("check");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      result.textContent = "Checking...";
      try {
        const response = await fetch("/api/health");
        const data = await response.json();
        result.textContent = "Server says: " + data.status;
      } catch (error) {
        result.textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
